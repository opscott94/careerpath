{% extends 'frontend/base.html' %}
{% block title %}JHS Career Guide - CareerPath Ghana{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto px-4 py-12" style="position:relative;">
  <div
    style="position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:url('https://images.pexels.com/photos/9879939/pexels-photo-9879939.jpeg');background-size:cover;background-position:center;opacity:0.08;">
  </div>
  <div class="text-center mb-10">
    <div class="w-12 h-12 rounded-xl bg-green-100 text-green-800 flex items-center justify-center mx-auto mb-4">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
    </div>
    <h1 class="text-3xl font-bold mb-3">JHS Career Guide</h1>
    <p class="text-gray-500">Tell us your dream career and we'll map it to the right SHS subjects</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-6 md:p-8 mb-6">
    <label class="block font-semibold mb-3 text-gray-700">What do you want to be? <span
        class="text-gray-400 font-normal">(type naturally)</span></label>
    <div class="relative flex items-center">
      <input id="careerInput" type="text" placeholder="e.g. I want to be a doctor, software developer, lawyer..."
        class="w-full border border-gray-200 rounded-xl pl-4 pr-16 sm:pr-32 py-3.5 focus:outline-none focus:ring-2 focus:ring-green-600 text-gray-800 text-sm sm:text-base shadow-sm"
        onkeydown="if(event.key==='Enter') searchCareer()">
      <button onclick="searchCareer()" type="button" aria-label="Search career"
        class="absolute right-1.5 bg-[#052e16] hover:bg-emerald-950 text-white px-4 sm:px-5 py-2.5 rounded-lg font-bold text-sm sm:text-base flex items-center gap-2 transition cursor-pointer shadow-sm">
        <svg class="w-4 h-4 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="hidden sm:inline">Search</span>
      </button>
    </div>
    <div class="flex flex-wrap gap-2 mt-4">
      <span class="text-xs sm:text-sm text-gray-400 self-center">Try:</span>
      <button onclick="document.getElementById('careerInput').value='I want to be a doctor'; searchCareer()"
        class="text-xs sm:text-sm bg-green-50 text-primary px-3 py-1 rounded-full hover:bg-green-100 transition">doctor</button>
      <button onclick="document.getElementById('careerInput').value='I want to be an engineer'; searchCareer()"
        class="text-xs sm:text-sm bg-green-50 text-primary px-3 py-1 rounded-full hover:bg-green-100 transition">engineer</button>
      <button onclick="document.getElementById('careerInput').value='I want to be a lawyer'; searchCareer()"
        class="text-xs sm:text-sm bg-green-50 text-primary px-3 py-1 rounded-full hover:bg-green-100 transition">lawyer</button>
      <button onclick="document.getElementById('careerInput').value='I want to be a nurse'; searchCareer()"
        class="text-xs sm:text-sm bg-green-50 text-primary px-3 py-1 rounded-full hover:bg-green-100 transition">nurse</button>
      <button onclick="document.getElementById('careerInput').value='I want to be an accountant'; searchCareer()"
        class="text-xs sm:text-sm bg-green-50 text-primary px-3 py-1 rounded-full hover:bg-green-100 transition">accountant</button>
      <button onclick="document.getElementById('careerInput').value='I want to be a journalist'; searchCareer()"
        class="text-xs sm:text-sm bg-green-50 text-primary px-3 py-1 rounded-full hover:bg-green-100 transition">journalist</button>
    </div>
  </div>

  <div id="loadingDiv" class="hidden text-center py-8">
    <div class="inline-block animate-spin text-green-700">
      <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor"></path></svg>
    </div>
    <p id="loadingText" class="text-gray-500 mt-2 font-medium">Our AI is finding your career path...</p>
  </div>

  <div id="aiResultsDiv" class="hidden"></div>
  <div id="resultsDiv" class="hidden"></div>
  <div id="subjectDiv" class="hidden"></div>
  <div id="programDiv" class="hidden"></div>
</div>

<script>
  async function searchCareer() {
    const query = document.getElementById('careerInput').value.trim();
    if (!query) return;
    document.getElementById('loadingDiv').classList.remove('hidden');
    document.getElementById('loadingText').textContent = 'Our AI is finding your career path...';
    document.getElementById('aiResultsDiv').classList.add('hidden');
    document.getElementById('resultsDiv').classList.add('hidden');
    document.getElementById('subjectDiv').classList.add('hidden');
    document.getElementById('programDiv').classList.add('hidden');
    document.getElementById('aiResultsDiv').innerHTML = '';
    document.getElementById('resultsDiv').innerHTML = '';
    document.getElementById('programDiv').innerHTML = '';

    try {
      const aiRes = await fetch('/api/ai-career-match/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify({ query: query })
      });
      const aiData = await aiRes.json();

      if (aiData.ai_match && aiData.matched_programs && aiData.matched_programs.length > 0) {
        document.getElementById('loadingDiv').classList.add('hidden');
        renderAiResults(aiData);
        return;
      }
    } catch (e) {
      console.error("Gemini AI match failed, falling back to keyword search:", e);
    }

    // Fallback to keyword search
    document.getElementById('loadingText').textContent = 'Finding the best career match...';
    const res = await fetch('/api/career-search/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({ query: query.toLowerCase() })
    });
    const data = await res.json();
    document.getElementById('loadingDiv').classList.add('hidden');
    renderKeywordResults(data, query);
  }

  function toggleRecommendedPrograms() {
    const container = document.getElementById('recommendedProgsContainer');
    const icon = document.getElementById('progToggleText');
    if (!container) return;
    if (container.style.display === 'none' || container.style.display === '') {
      container.style.display = 'block';
      if (icon) icon.innerHTML = '▲ Hide Programs';
    } else {
      container.style.display = 'none';
      if (icon) icon.innerHTML = '▼ Show Programs';
    }
  }

  // Bind handlers to global window scope so HTML attributes can access them from the module
  window.searchCareer = searchCareer;
  window.getProgramDetails = getProgramDetails;
  window.getSubjects = getSubjects;
  window.toggleRecommendedPrograms = toggleRecommendedPrograms;

  function renderAiResults(aiData) {
    let html = `
    <div style="border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;background:#fff;margin-bottom:16px;">
      <div style="background:#052e16;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:40px;height:40px;background:rgba(74,222,128,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#4ade80;flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          </div>
          <div>
            <p style="font-size:18px;font-weight:700;color:#fff;margin:0;line-height:1.2;">${aiData.career_name}</p>
            <p style="font-size:11px;color:#86efac;margin:2px 0 0;">AI-Recommended Career Path</p>
          </div>
        </div>
        <span style="font-size:11px;font-weight:700;background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3);padding:3px 10px;border-radius:100px;">AI Match</span>
      </div>
      <div style="padding:16px 20px;">
        <div style="background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#374151;line-height:1.6;">
          ${aiData.career_description}
        </div>

        ${aiData.elective_summary ? `
        <!-- SHS Elective Subject Selection Summary (Clean & Minimal UI) -->
        <div style="background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-bottom:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
            <span style="font-size:12px;font-weight:700;color:#111827;text-transform:uppercase;letter-spacing:0.04em;">
              SHS Elective Subject Requirements Guide
            </span>
            <span style="font-size:12px;font-weight:700;background:#dcfce7;color:#15803d;padding:4px 14px;border-radius:100px;border:1px solid #86efac;box-shadow:0 1px 3px rgba(21,128,61,0.12);display:inline-flex;align-items:center;gap:4px;">
              Track: ${aiData.elective_summary.tracks ? aiData.elective_summary.tracks.join(', ') : 'Science Track'}
            </span>
          </div>
          <p style="font-size:13px;color:#4b5563;margin:0 0 16px;line-height:1.5;">
            To qualify for university programmes leading to a career in <strong>${aiData.career_name}</strong>, select the following SHS electives:
          </p>

          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:12px;">
            <div style="background:#f9fafb;border:1px solid #f3f4f6;border-radius:10px;padding:14px;">
              <span style="font-size:11px;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:8px;">
                Mandatory Electives
              </span>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                ${aiData.elective_summary.mandatory_electives && aiData.elective_summary.mandatory_electives.length > 0
                  ? aiData.elective_summary.mandatory_electives.map(s => `<span style="font-size:12px;font-weight:600;background:#dcfce7;color:#15803d;padding:4px 10px;border-radius:6px;border:1px solid #bbf7d0;">${s}</span>`).join('')
                  : '<span style="font-size:12px;color:#6b7280;font-style:italic;">Any electives from this track</span>'
                }
              </div>
            </div>

            <div style="background:#f9fafb;border:1px solid #f3f4f6;border-radius:10px;padding:14px;">
              <span style="font-size:11px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:8px;">
                Recommended Electives
              </span>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                ${aiData.elective_summary.recommended_electives && aiData.elective_summary.recommended_electives.length > 0
                  ? aiData.elective_summary.recommended_electives.map(s => `<span style="font-size:12px;font-weight:600;background:#f3f4f6;color:#374151;padding:4px 10px;border-radius:6px;border:1px solid #e5e7eb;">${s}</span>`).join('')
                  : '<span style="font-size:12px;color:#6b7280;font-style:italic;">Any relevant electives from the track</span>'
                }
              </div>
            </div>
          </div>
        </div>
        ` : ''}

        <!-- Collapsible Recommended University Programs (Collapsed by default) -->
        <div style="border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;background:#fff;margin-bottom:20px;">
          <button onclick="toggleRecommendedPrograms()" 
                  style="width:100%;background:#f9fafb;border:none;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left;transition:background 0.2s;"
                  onmouseover="this.style.background='#f3f4f6'"
                  onmouseout="this.style.background='#f9fafb'">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:13px;font-weight:700;color:#111827;text-transform:uppercase;letter-spacing:0.04em;">
                Recommended University Programs (${aiData.matched_programs.length})
              </span>
              <span style="font-size:11px;color:#6b7280;background:#e5e7eb;padding:2px 8px;border-radius:100px;font-weight:600;">
                Click to expand
              </span>
            </div>
            <span id="progToggleText" style="font-size:12px;color:#15803d;font-weight:700;">▼ Show Programs</span>
          </button>

          <div id="recommendedProgsContainer" style="display:none;padding:16px;border-top:1px solid #e5e7eb;">
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${aiData.matched_programs.map((p, i) => `
                <div style="display:flex;align-items:flex-start;gap:12px;background:${i === 0 ? '#fefce8' : '#f9fafb'};border:1px solid ${i === 0 ? '#fde68a' : '#e5e7eb'};border-radius:12px;padding:14px 16px;cursor:pointer;transition:all 0.2s;"
                     class="hover:border-primary card-hover"
                     onclick="getProgramDetails('${p.program_name.replace(/'/g, "\\'")}')">
                  <div style="width:28px;height:28px;background:${i === 0 ? '#fef3c7' : '#e5e7eb'};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:${i === 0 ? '#92400e' : '#4b5563'};flex-shrink:0;">${i + 1}</div>
                  <div style="flex:1;">
                    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">
                      <p style="font-size:14px;font-weight:700;color:#1f2937;margin:0;">${p.program_name}</p>
                      <div style="display:flex;gap:6px;align-items:center;">
                        <span style="font-size:11px;font-weight:600;background:#e5e7eb;color:#374151;padding:2px 8px;border-radius:100px;">${p.universities}</span>
                        <span style="font-size:12px;color:#15803d;font-weight:700;">View Details →</span>
                      </div>
                    </div>
                    <p style="font-size:12px;color:#6b7280;margin:4px 0 0;line-height:1.5;">${p.reason}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div style="border-top:1px solid #f1f5f9;padding-top:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <p style="font-size:12px;color:#6b7280;margin:0;">Powered by AI • Based on available university data</p>
          <a href="/shs-eligibility/" style="font-size:13px;font-weight:600;background:#052e16;color:#4ade80;padding:8px 18px;border-radius:10px;text-decoration:none;">
            Check Eligibility →
          </a>
        </div>
      </div>
    </div>`;
    document.getElementById('aiResultsDiv').innerHTML = html;
    document.getElementById('aiResultsDiv').classList.remove('hidden');
  }

  function renderKeywordResults(data, query) {
    if (!data.results || data.results.length === 0) {
      document.getElementById('resultsDiv').innerHTML = `
      <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-6 text-center">
        <p class="font-semibold text-yellow-800">No careers found for "${query}"</p>
        <p class="text-yellow-700 text-sm mt-1">Try words like: doctor, engineer, lawyer, nurse, teacher, accountant</p>
      </div>`;
      document.getElementById('resultsDiv').classList.remove('hidden');
      return;
    }

    let html = '<h2 class="font-bold text-lg mb-4 text-gray-700">Best matches for you:</h2><div class="space-y-3">';
    data.results.forEach(c => {
      html += `
      <div class="bg-white rounded-2xl shadow-sm p-5 card-hover cursor-pointer border-2 border-transparent hover:border-primary"
           onclick="getSubjects(${c.id}, '${c.name}')">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div>
              <div class="font-bold text-gray-800">${c.name}</div>
              <div class="text-sm text-primary">${c.learning_area} Track</div>
            </div>
          </div>
          <a href="/jhs-guide/career/${c.id}/" style="font-size:13px;font-weight:600;background:#052e16;color:#4ade80;padding:8px 18px;border-radius:10px;text-decoration:none;">View Subjects →</a>
        </div>
        <p class="text-gray-500 text-sm mt-3">${c.why_text}</p>
      </div>`;
    });
    html += '</div>';
    document.getElementById('resultsDiv').innerHTML = html;
    document.getElementById('resultsDiv').classList.remove('hidden');
  }

  async function getSubjects(careerId, careerName) {
    document.getElementById('subjectDiv').classList.add('hidden');
    const res = await fetch('/api/subject-recommendation/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({ career_id: careerId })
    });
    const d = await res.json();

    let html = `
    <div class="mt-6" style="border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;background:#fff;">

      <div style="background:#052e16;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:14px;">
          <div>
            <p style="font-size:20px;font-weight:700;color:#fff;margin:0;">${d.career}</p>
            <p style="font-size:12px;color:#86efac;margin:4px 0 0;">${d.learning_area} Track</p>
          </div>
        </div>
        <span style="font-size:11px;font-weight:700;background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3);padding:4px 12px;border-radius:100px;">Best Match</span>
      </div>

      <div style="padding:20px 24px;">
        <div style="background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#374151;line-height:1.6;">
          ${d.why_text}
        </div>

        <p style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 10px;display:flex;align-items:center;gap:6px;">
          Core subjects (all students)
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;">
          ${d.core_subjects.map(s => `<span style="font-size:12px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:5px 12px;border-radius:100px;">${s.name}</span>`).join('')}
        </div>

        <p style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 10px;">
          Required electives
        </p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
          ${d.mandatory_electives.map(s => `
            <div style="display:flex;align-items:center;gap:10px;background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;">
              <span style="font-size:11px;font-weight:700;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:100px;flex-shrink:0;">Required</span>
              <span style="font-size:13px;color:#78350f;font-weight:500;">${s.name}</span>
            </div>`).join('')}
        </div>

        <p style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 10px;">
          Recommended electives
        </p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
          ${d.recommended_electives.map(s => `
            <div style="padding:10px 14px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:${s.reason ? '4px' : '0'};">
                <span style="font-size:11px;font-weight:700;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:100px;flex-shrink:0;">Recommended</span>
                <span style="font-size:13px;color:#1e3a8a;font-weight:500;">${s.name}</span>
              </div>
              ${s.reason ? `<p style="font-size:11px;color:#3b82f6;margin:0 0 0 0;padding-left:0;">${s.reason}</p>` : ''}
            </div>`).join('')}
        </div>

        <div style="border-top:1px solid #f1f5f9;padding-top:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <p style="font-size:12px;color:#6b7280;margin:0;">Based on NaCCA 2024/2025 guidelines</p>
          <a href="/shs-eligibility/" style="font-size:13px;font-weight:600;background:#052e16;color:#4ade80;padding:8px 18px;border-radius:100px;text-decoration:none;">
            Check University Eligibility
          </a>
        </div>
      </div>
    </div>`;
    document.getElementById('subjectDiv').innerHTML = html;
    document.getElementById('subjectDiv').classList.remove('hidden');
    document.getElementById('subjectDiv').scrollIntoView({ behavior: 'smooth' });
  }

  function getEmoji(icon) {
    return '';
  }

  function getCookie(name) {
    let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
    return v ? v[2] : null;
  }

  async function getProgramDetails(programName) {
    document.getElementById('programDiv').classList.add('hidden');
    const res = await fetch('/api/program-details/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({ program_name: programName })
    });
    const d = await res.json();

    const uniLogos = {
      KNUST: '/static/images/knust.png',
      UG: '/static/images/ug.png',
      UCC: '/static/images/ucc.png',
      UDS: '/static/images/uds.png',
      UENR: '/static/images/uenr.png'
    };

    let html = `
    <div class="mt-6" style="border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;background:#fff;">

      <div style="background:#052e16;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:52px;height:52px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);flex-shrink:0;">
            <img src="/static/images/career.png" style="width:100%;height:100%;object-fit:contain;" alt="Program Logo">
          </div>
          <div>
            <p style="font-size:20px;font-weight:700;color:#fff;margin:0;">${d.program_name}</p>
            <p style="font-size:12px;color:#86efac;margin:4px 0 0;">Offered by ${d.offerings.length} Universities</p>
          </div>
        </div>
        <span style="font-size:11px;font-weight:700;background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3);padding:4px 12px;border-radius:100px;">Program Details</span>
      </div>

      <div style="padding:20px 24px;display:flex;flex-direction:column;gap:24px;">
        ${d.offerings.map((off, idx) => `
          <div style="${idx > 0 ? 'border-top: 1px solid #e2e8f0; padding-top: 20px;' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
              <div>
                <h3 style="font-size:16px;font-weight:700;color:#1e293b;margin:0;display:flex;align-items:center;gap:10px;">
                  <div style="width:32px;height:32px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;padding:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.04);">
                    <img src="${uniLogos[(off.university_short || '').toUpperCase()] || '/static/images/career.png'}" style="width:100%;height:100%;object-fit:contain;" alt="${off.university_short}">
                  </div>
                  ${off.university} (${off.university_short})
                </h3>
                <p style="font-size:12px;color:#64748b;margin:2px 0 0;">
                  Offered across ${off.campuses ? off.campuses.length : 1} Campus${(off.campuses && off.campuses.length > 1) ? 'es' : ''}
                </p>
              </div>
              <span style="font-size:12px;font-weight:700;background:#f0fdf4;color:#15803d;padding:4px 12px;border-radius:100px;border:1px solid #bbf7d0;">
                Best Cutoff: ${off.min_cutoff || off.cutoff || 'N/A'}
              </span>
            </div>



            <p style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 8px;display:flex;align-items:center;gap:6px;">
               Core subjects (required pass)
            </p>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;">
              ${off.core_subjects.length > 0
        ? off.core_subjects.map(s => `<span style="font-size:11px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:4px 10px;border-radius:100px;">${s.name}</span>`).join('')
        : '<span style="font-size:11px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:4px 10px;border-radius:100px;">Core Mathematics</span><span style="font-size:11px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:4px 10px;border-radius:100px;">English Language</span><span style="font-size:11px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:4px 10px;border-radius:100px;">Integrated Science</span><span style="font-size:11px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:4px 10px;border-radius:100px;">Social Studies</span>'
      }
            </div>

            <p style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 8px;">
               Elective Requirements
            </p>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${off.requirements.map(req => `
                <div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;background:#f8fafc;">
                  <p style="font-size:12px;font-weight:700;color:#334155;margin:0 0 6px;border-bottom:1px solid #e2e8f0;padding-bottom:4px;">
                    Learning Track: ${req.learning_area}
                  </p>
                  
                  ${req.mandatory_subjects.length > 0 ? `
                    <div style="margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                      <span style="font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;padding:1px 6px;border-radius:100px;">Mandatory</span>
                      <span style="font-size:12px;color:#475569;font-weight:500;">
                        ${req.mandatory_subjects.map(s => s.name).join(', ')}
                      </span>
                    </div>
                  ` : ''}

                  ${req.elective_subjects.length > 0 ? `
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                      <span style="font-size:10px;font-weight:700;color:#1e40af;background:#dbeafe;padding:1px 6px;border-radius:100px;">Recommended</span>
                      <span style="font-size:12px;color:#475569;font-weight:500;">
                        ${req.elective_subjects.map(s => s.name).join(', ')}
                      </span>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
        
        <div style="border-top:1px solid #f1f5f9;padding-top:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <p style="font-size:12px;color:#6b7280;margin:0;">Based on University admissions guidelines</p>
        </div>
      </div>
    </div>`;
    document.getElementById('programDiv').innerHTML = html;
    document.getElementById('programDiv').classList.remove('hidden');
    document.getElementById('programDiv').scrollIntoView({ behavior: 'smooth' });
  }
</script>
{% endblock %}
