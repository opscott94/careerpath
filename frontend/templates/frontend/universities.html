{% extends 'frontend/base.html' %}
{% block title %}Universities — CareerPath Ghana{% endblock %}
{% block content %}
<div style="max-width:1320px;margin:0 auto;padding:32px 32px 0;">
  <p style="font-size:13px;color:#6b7280;margin:0;">
    <a href="/" style="color:#6b7280;text-decoration:none;">Home</a> &nbsp;›&nbsp;
    <span style="color:#111827;font-weight:600;">Universities</span>
  </p>
</div>

<div style="max-width:1320px;margin:0 auto;padding:24px 32px 80px;">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {% for uni in unis %}
    <div onclick="window.location='/university/{{ uni.key }}/'"
      style="cursor:pointer;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.12);transition:transform 0.2s;position:relative;height:340px;"
      onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
      <div
        style="position:absolute;inset:0;background-image:url('{{ uni.thumb }}');background-size:cover;background-position:center;">
      </div>
      <div
        style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.3) 45%,rgba(0,0,0,0.05) 65%);">
      </div>
      <div style="position:absolute;bottom:0;left:0;right:0;padding:20px;">
        <p
          style="color:#fff;font-size:19px;font-weight:800;margin:0 0 14px;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,0.4);">
          {{ uni.full }}</p>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path d="M12 3L2 8l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
          <span style="font-size:13px;font-weight:500;color:#f3f4f6;">{{ uni.program_count }} Programmes</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
          <span style="font-size:13px;color:#e5e7eb;">{{ uni.location }}</span>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
