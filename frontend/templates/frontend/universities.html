{% extends 'frontend/base.html' %}
{% block title %}Universities — CareerPath Ghana{% endblock %}
{% block content %}
<div style="max-width:1320px;margin:0 auto;padding:32px 32px 0;">
  <p style="font-size:13px;color:#6b7280;margin:0;">
    <a href="/" style="color:#6b7280;text-decoration:none;">Home</a> &nbsp;›&nbsp;
    <span style="color:#111827;font-weight:600;">Universities</span>
  </p>
</div>

<div style="max-width:1320px;margin:0 auto;padding:24px 32px 80px;">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    {% for uni in unis %}
    <div onclick="window.location='/university/{{ uni.key }}/'" style="cursor:pointer;border-radius:16px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.1);transition:transform 0.2s;background:#fff;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
      <div style="position:relative;height:260px;background-image:url('{{ uni.thumb }}');background-size:cover;background-position:center;">
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent 55%);"></div>
        <span style="position:absolute;top:14px;left:14px;background:#dcfce7;color:#15803d;font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:5px 12px;border-radius:100px;">Public</span>
        <div style="position:absolute;bottom:16px;left:20px;right:20px;">
          <p style="color:#fff;font-size:21px;font-weight:800;margin:0;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,0.4);">{{ uni.full }}</p>
        </div>
      </div>
      <div style="padding:20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f1f5f9;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2"><path d="M12 3L2 8l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <span style="font-size:13px;font-weight:600;color:#374151;">{{ uni.program_count }} Programmes</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span style="font-size:13px;color:#6b7280;">{{ uni.location }}</span>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
